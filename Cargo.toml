[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "2"
dirs = "6"
rand = "0.9"
ureq = { version = "3", default-features = false,
         features = ["native-tls", "gzip"] }
slint = { version = "1", default-features = false,
          features = ["std", "compat-1-2", "backend-winit", "renderer-software",
                      "unstable-winit-030"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
